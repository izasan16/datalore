server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: Datalore
  datasource:
    url: jdbc:postgresql://localhost:15432/datalore
    username: datalore
    password: datalore_dev_2026
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 16379

Datalore:
  version: 0.1.0
  # dev 专用密钥（32 字节 base64 = Datalore_dev_key_32_bytes!!!!!!!!）。生产用环境变量 Datalore_CRYPTO_KEY 覆盖。
  crypto-key: "ZGFhc3Byb19kZXZfa2V5XzMyX2J5dGVzISEhISEhISE="
  minio:
    endpoint: http://localhost:19000
    access-key: datalore
    secret-key: datalore_dev_2026
    bucket: datalore-staging
    init-bucket: ${DATALORE_MINIO_INIT_BUCKET:true}
  sql:
    max-rows: 10000      # SQL 网关单次结果行数上限
    max-seconds: 30      # SQL 网关语句超时（秒）
  etl:
    worker-url: ${DATALORE_ETL_WORKER_URL:http://localhost:18090}
    worker-token: ${DATALORE_ETL_WORKER_TOKEN:dev-worker-token}

sa-token:
  token-name: Authorization
  # 前后端分离：token 走 Authorization 头，Bearer 前缀由 sa-token 统一剥离
  is-read-cookie: false
  is-read-header: true
  token-prefix: Bearer
  is-contract: false
