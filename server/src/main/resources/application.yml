server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: daaspro
  datasource:
    url: jdbc:postgresql://localhost:15432/daaspro
    username: daaspro
    password: daaspro_dev_2026
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 16379

daaspro:
  version: 0.1.0
  # dev 专用密钥（32 字节 base64 = daaspro_dev_key_32_bytes!!!!!!!!）。生产用环境变量 DAASPRO_CRYPTO_KEY 覆盖。
  crypto-key: "ZGFhc3Byb19kZXZfa2V5XzMyX2J5dGVzISEhISEhISE="
  minio:
    endpoint: http://localhost:19000
    access-key: daaspro
    secret-key: daaspro_dev_2026
    bucket: daaspro-staging

sa-token:
  token-name: Authorization
  # 前后端分离：token 走 Authorization 头，Bearer 前缀由 sa-token 统一剥离
  is-read-cookie: false
  is-read-header: true
  token-prefix: Bearer
  is-contract: false
