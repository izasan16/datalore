services:
  postgres:
    image: postgres:16
    container_name: daaspro-postgres
    environment:
      POSTGRES_DB: daaspro
      POSTGRES_USER: daaspro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daaspro"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: daaspro-redis
    ports:
      - "16379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio
    container_name: daaspro-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - miniodata:/data

  etl-worker:
    build: ./etl-worker
    container_name: daaspro-etl-worker
    environment:
      DAASPRO_WORKER_TOKEN: ${DAASPRO_ETL_WORKER_TOKEN:-dev-worker-token}
      DAASPRO_WORKER_PORT: 8090
    ports:
      - "18090:8090"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
